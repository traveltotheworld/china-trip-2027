<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12345b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/style.css?v=55">
<title>Luggage Tag — China Trip 2027</title>
<style>
:root{--lt-navy:#12345b;--lt-cream:#fbf5ea;--lt-ink:#10233d;--lt-muted:#65748a;--lt-green:#18a768;--lt-line:#e6e1d8}
html,body{min-height:100%;margin:0}
body{background:linear-gradient(180deg,#eef5fb 0%,#f8fafc 48%,#f3efe7 100%);color:var(--lt-ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.luggage-shell{max-width:620px;margin:0 auto;padding:18px 14px 28px}
.luggage-card{position:relative;overflow:hidden;background:var(--lt-cream);border:1px solid rgba(18,52,91,.12);border-radius:30px;padding:0;box-shadow:0 24px 70px rgba(18,52,91,.16)}
.luggage-hero{position:relative;padding:25px 22px 118px;background:linear-gradient(145deg,#fffaf1 0%,#f9f0df 52%,#dfeefa 100%)}
.luggage-hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 90% 35%,rgba(255,255,255,.9),transparent 28%),linear-gradient(125deg,transparent 55%,rgba(18,52,91,.07) 55%,transparent 75%);pointer-events:none}
.luggage-skyline{position:absolute;right:-20px;bottom:-8px;width:72%;height:125px;opacity:.24;background:linear-gradient(160deg,transparent 40%,#6d98bd 40% 48%,transparent 48%),linear-gradient(172deg,transparent 53%,#7ba2c4 53% 61%,transparent 61%),linear-gradient(178deg,transparent 63%,#527fa9 63% 72%,transparent 72%);clip-path:polygon(0 100%,0 72%,8% 72%,12% 54%,18% 72%,25% 38%,32% 72%,38% 50%,44% 72%,51% 22%,57% 72%,64% 45%,70% 72%,77% 35%,83% 72%,91% 52%,100% 72%,100% 100%)}
.luggage-badge{position:relative;display:inline-flex;align-items:center;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.76);border:1px solid rgba(18,52,91,.09);color:#1769aa;font-weight:800;font-size:11px;letter-spacing:.03em}
.luggage-brand{position:relative;margin:15px 0 4px;font-size:34px;line-height:.95;font-weight:900;letter-spacing:-.045em;color:var(--lt-navy)}
.luggage-trip{position:relative;font-size:16px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#3d5b79}
.luggage-motto{position:relative;margin-top:9px;color:#5e7186;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.luggage-tag-icon{position:absolute;left:22px;bottom:-22px;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid rgba(18,52,91,.12);box-shadow:0 12px 30px rgba(18,52,91,.14);font-size:34px;z-index:3}
.luggage-body{position:relative;padding:54px 18px 20px;background:rgba(255,255,255,.9)}
.luggage-title{margin:0 0 7px;padding-left:4px;font-size:27px;line-height:1.08;letter-spacing:-.035em;color:#122641}
.luggage-sub{margin:0 4px 18px;color:var(--lt-muted);line-height:1.5;font-size:14px}
.luggage-grid{display:grid;gap:10px}
.luggage-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:18px;background:#f5f8fb;border:1px solid #e6edf4}
.luggage-row-icon{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:grid;place-items:center;background:#e3edf8;font-size:19px}
.luggage-row-content{min-width:0}.luggage-label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#718096;margin-bottom:3px;font-weight:800}.luggage-value{font-size:16px;font-weight:800;overflow-wrap:anywhere}
.luggage-actions{display:grid;gap:10px;margin-top:16px}.luggage-btn{width:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 16px;border-radius:16px;text-decoration:none;border:1px solid #dce5ee;font-weight:850;color:var(--lt-navy);background:#fff;min-height:50px}.luggage-btn.primary{background:var(--lt-green);color:#fff;border-color:var(--lt-green);box-shadow:0 10px 22px rgba(24,167,104,.18)}
.luggage-privacy{margin-top:14px;padding:13px 14px;border-radius:16px;background:#fff5df;color:#79521b;border:1px solid #f0dfbc;font-size:12px;line-height:1.5}
.luggage-footer{padding:15px 18px 22px;background:#fffdf9;border-top:1px solid var(--lt-line);text-align:center;color:#718096}.luggage-footer strong{display:block;color:#1b3553;font-size:13px}.luggage-footer span{font-size:10px;letter-spacing:.16em;text-transform:uppercase}.luggage-error{margin:18px;padding:20px;border-radius:18px;background:#fff0f0;color:#a33}.luggage-loading{padding:50px 20px;text-align:center;color:#64748b}
@media(min-width:620px){.luggage-shell{padding-top:38px}.luggage-body{padding-left:28px;padding-right:28px}.luggage-footer{padding-left:28px;padding-right:28px}}
@media(max-width:380px){.luggage-shell{padding:8px}.luggage-card{border-radius:24px}.luggage-hero{padding:21px 18px 108px}.luggage-brand{font-size:30px}.luggage-body{padding:51px 12px 16px}.luggage-title{font-size:24px}.luggage-row{padding:12px}.luggage-row-icon{width:36px;height:36px;flex-basis:36px}}
</style>
</head>
<body>
<main class="luggage-shell">
 <section id="luggageContent" class="luggage-card"><div class="luggage-loading">Memuat informasi koper…</div></section>
</main>
<script src="assets/supabase-config.js"></script>
<script src="assets/supabase-data.js"></script>
<script src="assets/luggage.js?v=55"></script>
</body>
</html>
