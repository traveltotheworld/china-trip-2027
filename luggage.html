<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12345b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/style.css?v=62">
<title>Luggage Tag — China Trip 2027</title>
<style>
:root{--ink:#102542;--muted:#72839a;--line:#e5edf4;--soft:#f4f8fc;--green:#19ad70;--green-dark:#11915d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
body{background:linear-gradient(180deg,#f5f8fc 0%,#edf3f8 100%);padding:16px}
.luggage-shell{width:100%;min-height:calc(100svh - 32px);max-width:430px;margin:auto;display:flex;align-items:center;justify-content:center}
.luggage-card{width:100%;min-height:0;background:transparent;overflow:visible}
.contact-card{background:rgba(255,255,255,.98);border:1px solid rgba(16,37,66,.07);border-radius:28px;padding:22px 18px 18px;box-shadow:0 22px 55px rgba(20,50,80,.13),0 4px 14px rgba(20,50,80,.05)}
.contact-top{display:flex;gap:13px;align-items:flex-start;margin-bottom:17px}
.contact-icon{width:54px;height:54px;flex:0 0 54px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,#eaf4ff,#dcecfb);font-size:25px;box-shadow:inset 0 1px 0 #fff}
.contact-eyebrow{font-size:9px;font-weight:900;letter-spacing:.18em;color:#7890aa;margin:1px 0 5px}
.luggage-title{margin:0;font-size:clamp(22px,6vw,29px);line-height:1.04;letter-spacing:-.045em;font-weight:900;color:var(--ink)}
.luggage-sub{margin:7px 0 0;color:var(--muted);font-size:11.5px;line-height:1.4}
.luggage-grid{display:grid;gap:8px}.luggage-row{display:flex;align-items:center;gap:11px;padding:9px 10px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,#f8fbfe,#f0f6fb);min-height:55px}.luggage-row-icon{width:36px;height:36px;flex:0 0 36px;border-radius:50%;display:grid;place-items:center;background:#e5f0fa;font-size:17px}.luggage-row-content{min-width:0}.luggage-label{display:block;font-size:8px;text-transform:uppercase;letter-spacing:.16em;color:#7a8ba0;font-weight:900;margin-bottom:3px}.luggage-value{font-size:13px;line-height:1.18;font-weight:850;overflow-wrap:anywhere;color:#142b48}
.contact-actions{display:grid;gap:8px;margin-top:11px}.luggage-btn{margin-top:0;width:100%;min-height:49px;display:flex;align-items:center;justify-content:center;gap:9px;border-radius:16px;text-decoration:none;font-size:14px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--green),var(--green-dark));box-shadow:0 10px 22px rgba(25,173,112,.23);transition:transform .15s ease,box-shadow .15s ease}.luggage-btn:active{transform:scale(.985);box-shadow:0 6px 14px rgba(25,173,112,.2)}.luggage-btn b{font-size:24px;font-weight:500;line-height:0;margin-left:2px}.email-btn{background:linear-gradient(135deg,#2388e8,#1769c2);box-shadow:0 10px 22px rgba(35,136,232,.20)}.email-mark{width:27px;height:27px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:14px;line-height:1}.wa-mark{width:27px;height:27px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:15px;line-height:1}
.contact-note{margin-top:10px;text-align:center;color:#91a0b1;font-size:8.5px;line-height:1.35}
.luggage-error{background:#fff;border:1px solid #f0d8d8;border-radius:20px;padding:20px;color:#a33;box-shadow:0 12px 35px rgba(20,50,80,.08)}.luggage-loading{padding:30px;text-align:center;color:#64748b}
@media (max-height:720px){body{padding:10px}.luggage-shell{min-height:calc(100svh - 20px)}.contact-card{padding:16px 14px 13px;border-radius:23px}.contact-top{gap:10px;margin-bottom:11px}.contact-icon{width:44px;height:44px;flex-basis:44px;border-radius:14px;font-size:21px}.contact-eyebrow{font-size:7px;margin-bottom:3px}.luggage-title{font-size:20px}.luggage-sub{font-size:9.5px;margin-top:4px}.luggage-grid{gap:5px}.luggage-row{min-height:42px;padding:6px 8px;border-radius:12px;gap:8px}.luggage-row-icon{width:29px;height:29px;flex-basis:29px;font-size:14px}.luggage-label{font-size:6.5px;margin-bottom:1px}.luggage-value{font-size:10.5px}.contact-actions{gap:5px;margin-top:7px}.luggage-btn{margin-top:0;min-height:39px;border-radius:12px;font-size:11px}.luggage-btn b{font-size:19px}.email-mark{width:22px;height:22px;font-size:11px}.wa-mark{width:22px;height:22px;font-size:12px}.contact-note{margin-top:6px;font-size:7px}}
@media (min-width:700px){body{padding:20px}.luggage-shell{max-width:430px}}
</style>
</head>
<body>
<main class="luggage-shell"><section id="luggageContent" class="luggage-card"><div class="luggage-loading">Memuat informasi koper…</div></section></main>
<script src="assets/supabase-config.js"></script>
<script src="assets/supabase-data.js"></script>
<script src="assets/luggage.js?v=62"></script>
</body>
</html>
