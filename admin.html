<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111820">
<link rel="stylesheet" href="assets/style.css">
<title>Admin — China Trip 2027</title>
</head>
<body class="simple-admin-body">
<main class="simple-admin-shell">
  <section id="loginPanel" class="simple-login-card">
    <div class="simple-login-logo">CT</div>
    <span class="eyebrow">China Trip 2027</span>
    <h1>Masuk Admin</h1>
    <p class="lead">Gunakan akun admin untuk mengubah data perjalanan.</p>
    <form id="loginForm" class="admin-form">
      <label>Email
        <input id="adminEmail" type="email" autocomplete="username" value="septinogao@gmail.com" required>
      </label>
      <label>Password
        <input id="adminPassword" type="password" autocomplete="current-password" required>
      </label>
      <button class="admin-primary" type="submit">Masuk</button>
      <p id="loginError" class="admin-error" hidden></p>
    </form>
  </section>

  <section id="adminPanel" class="simple-admin-app" hidden>
    <aside class="simple-admin-sidebar">
      <div class="simple-admin-brand">
        <div class="simple-brand-icon">CT</div>
        <div><strong>China Trip</strong><small>Admin 2027</small></div>
      </div>
      <nav id="adminTabs" class="simple-admin-menu"></nav>
      <div class="simple-admin-sidebar-bottom">
        <a href="index.html" class="simple-side-link">🌐 Lihat Website</a>
        <button id="logoutBtn" class="simple-side-link">↪ Keluar</button>
      </div>
    </aside>

    <section class="simple-admin-main">
      <header class="simple-admin-topbar">
        <div>
          <span id="editorCategory" class="eyebrow">Beranda</span>
          <h1 id="editorTitle">Dashboard</h1>
          <p id="editorDescription" class="lead">Pilih bagian yang ingin diubah.</p>
        </div>
        <span id="saveStatus" class="simple-save-status">Siap</span>
      </header>

      <section class="simple-editor-card">
        <div id="formEditor" class="cms-form-editor"></div>
        <div id="editorActions" class="simple-sticky-actions">
          <button id="saveBtn" class="admin-primary">Simpan</button>
          <button id="reloadBtn" class="admin-secondary">Batalkan Perubahan</button>
        </div>
      </section>

      <section id="backupPanel" class="simple-backup-card">
        <details>
          <summary>Backup dan pemulihan data</summary>
          <p class="lead">Unduh cadangan sebelum melakukan perubahan besar.</p>
          <div class="admin-actions">
            <button id="exportBtn" class="admin-secondary">Download Backup</button>
            <label class="admin-secondary file-button">Restore Backup
              <input id="importInput" type="file" accept=".json,application/json" hidden>
            </label>
          </div>
        </details>
      </section>
    </section>
  </section>
</main>
<script src="assets/admin-defaults.js"></script>
<script src="assets/supabase-config.js"></script>
<script src="assets/supabase-data.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
